services:
  # ─────────────────────────────────────────────
  # Backend — Node/Express API
  # ─────────────────────────────────────────────
  - type: web
    name: agripool-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # ← Set manually in Render dashboard (never commit this value)
      - key: SESSION_SECRET
        generateValue: true  # ← Render auto-generates a secure random value
      - key: CLIENT_URL
        value: https://agripool-web.onrender.com

  # ─────────────────────────────────────────────
  # Frontend — React/Vite Static Site
  # ─────────────────────────────────────────────
  - type: web
    name: agripool-web
    runtime: static
    rootDir: client
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://agripool-api.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
